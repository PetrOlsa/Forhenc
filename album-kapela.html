<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Členové kapely – fotky | Forhenc</title>
    <meta name="description" content="Seznamte se se členy folkrockové kapely Forhenc ze Zbraslavi: Lucka, Štěpán, Petr, Víťa, Ondra a Zdeněk." />
    <link rel="canonical" href="https://petrolsa.github.io/Forhenc/album-kapela.html" />
    <link rel="icon" type="image/png" sizes="32x32" href="public/web/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="public/web/favicon-48.png" />
    <link rel="apple-touch-icon" href="public/web/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Forhenc" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="Členové kapely – fotky | Forhenc" />
    <meta property="og:description" content="Seznamte se se členy folkrockové kapely Forhenc ze Zbraslavi: Lucka, Štěpán, Petr, Víťa, Ondra a Zdeněk." />
    <meta property="og:url" content="https://petrolsa.github.io/Forhenc/album-kapela.html" />
    <meta property="og:image" content="https://petrolsa.github.io/Forhenc/public/web/lucka.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Oswald:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #ffffff;
        color: #000000;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid #000;
        outline-offset: 4px;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      h1,
      h2,
      h3 {
        font-family: "Oswald", sans-serif;
        text-transform: uppercase;
        line-height: 1.1;
      }

      .container {
        width: min(1120px, calc(100% - 3rem));
        margin: 0 auto;
      }

      .page-header {
        padding: 2rem 0 1rem;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .back-link:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .album-hero {
        margin-bottom: 3rem;
      }

      .album-hero-cover {
        width: 100%;
        max-height: 32rem;
        object-fit: cover;
        margin-bottom: 1.5rem;
      }

      .album-title {
        font-size: clamp(2.5rem, 6vw, 5rem);
        margin-bottom: 0.75rem;
      }

      .album-description {
        max-width: 42rem;
        font-size: 1.1rem;
        color: #444;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        padding-bottom: 4rem;
      }

      .photo-card {
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
      }

      .photo-image {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
      }

      .photo-caption {
        padding: 0.9rem 1rem 1rem;
        font-size: 0.95rem;
        color: #555;
      }

      @media (min-width: 640px) {
        .photo-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 960px) {
        .photo-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <a href="index.html#galerie" class="back-link">Zpět na hlavní stránku</a>
        <section class="album-hero">
          <img src="public/web/lucka.jpeg" alt="Lucka, zpěvačka kapely Forhenc" class="album-hero-cover" />
          <h1 class="album-title">Kapela</h1>
          <p class="album-description">
            První fotoalbum webu Forhenc. Po rozkliknutí z hlavní stránky tu najdeš všechny
            aktuálně nahrané fotografie kapely.
          </p>
        </section>
      </header>

      <main>
        <section class="photo-grid" aria-label="Fotografie alba Kapela">
          <figure class="photo-card">
            <a href="public/web/lucka.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/lucka.jpeg" alt="Lucka – zpěv, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Lucka</figcaption>
          </figure>
          <figure class="photo-card">
            <a href="public/web/stepan.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/stepan.jpeg" alt="Štěpán – zpěv a kytara, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Štěpán</figcaption>
          </figure>
          <figure class="photo-card">
            <a href="public/web/petr.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/petr.jpeg" alt="Petr – baskytara, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Petr</figcaption>
          </figure>
          <figure class="photo-card">
            <a href="public/web/vita.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/vita.jpeg" alt="Víťa – saxofon, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Víťa</figcaption>
          </figure>
          <figure class="photo-card">
            <a href="public/web/ondra.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/ondra.jpeg" alt="Ondra – klávesy, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Ondra</figcaption>
          </figure>
          <figure class="photo-card">
            <a href="public/web/zdenek.jpeg" class="photo-link">
              <img loading="lazy" decoding="async" src="public/web/zdenek.jpeg" alt="Zdeněk – bicí, Forhenc" class="photo-image" />
            </a>
            <figcaption class="photo-caption">Zdeněk</figcaption>
          </figure>
        </section>
      </main>
    </div>
    <script src="lightbox.js"></script>
  </body>
</html>
